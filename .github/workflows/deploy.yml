name: Build and Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'HMS/**'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./HMS
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hms:latest
            docker stop hms || true
            docker rm hms || true
            docker run -d \
              --name hms \
              --network host \
              --env-file /home/adith/hms/.env \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/hms:latest
            docker image prune -f
            sleep 5
            docker ps --filter "name=hms" --filter "status=running" | grep hms \
              && echo "✓ Deployment successful" \
              || (docker logs hms --tail 50 && exit 1)
