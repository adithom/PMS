spring.application.name=HMS

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/HMS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hms}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql
logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.com.adith.os.HMS=INFO
# spring.jpa.open-in-view=false

# JWT — generate a valid secret with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:mkbc+YSyryvhbDWmJ9W/HBtX+m5Tc1eF5Gtfp+u3dks=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

app.admin.username=${ADMIN_USERNAME:adith}
app.admin.password=${ADMIN_PASSWORD:adith123}

# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Invoice storage
hms.billing.invoice-storage-path=${INVOICE_STORAGE_PATH:./hms-data/invoices/}
hms.billing.logo-path=${LOGO_PATH:logo.png}

# Cloudflare R2 Object Storage
# Leave account-id/access-key/secret blank locally — PDFs will be stored on disk only.
# Set all four R2_* env vars in production to enable cloud upload.
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:spicetree-primary}
cloudflare.r2.presigned-url-expiry-minutes=${R2_PRESIGNED_URL_EXPIRY_MINUTES:60}

# Night Audit - nightly room charge posting (default: 2:00 AM IST daily)
hms.night-audit.cron=${NIGHT_AUDIT_CRON:0 0 2 * * *}

# Timezone — all timestamps in IST (UTC+5:30)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Port — Railway injects PORT env var
server.port=${PORT:8080}

# Actuator — health endpoint on a separate local-only port
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Graceful shutdown — drain in-flight requests before closing context
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
