spring.application.name=HMS

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
logging.level.root=WARN

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.com.adith.os.HMS.billing.nightaudit=INFO
# spring.jpa.open-in-view=false

# JWT — generate a valid secret with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}


# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Invoice storage
hms.billing.logo-path=${LOGO_PATH:logo.png}

# Night Audit - nightly room charge posting (default: 2:00 AM IST daily)
hms.night-audit.cron=${NIGHT_AUDIT_CRON:0 0 2 * * *}

# Timezone — all timestamps in IST (UTC+5:30)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Port — Railway injects PORT env var
server.port=${PORT:8080}

# Disable API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator — health endpoint on a separate local-only port
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Graceful shutdown — drain in-flight requests before closing context
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
