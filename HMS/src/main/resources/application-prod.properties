spring.application.name=HMS

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
logging.level.root=WARN

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=postgresql
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# spring.jpa.open-in-view=false

# JWT — generate a valid secret with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}


# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Invoice storage
hms.billing.logo-path=${LOGO_PATH:logo.png}

# Night Audit - nightly room charge posting (default: 2:00 AM daily)
hms.night-audit.cron=${NIGHT_AUDIT_CRON:0 0 2 * * *}

# Port — Railway injects PORT env var
server.port=${PORT:8080}
